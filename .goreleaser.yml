# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# goreleaser v2 configuration
version: 2

before:
  hooks:
    - go mod tidy

builds:
  -
    id: "tlsinfo"
    binary: tlsinfo
    main: ./cmd/tlsinfo/main.go
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main._version={{ .Tag }}
    goos:
      - linux
      - freebsd
      - netbsd
      - openbsd
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
archives:
  -
    id: tlsinfo-binaries
    name_template: "tlsinfo-{{ .Os }}_{{ .Arch }}_{{ .Version }}"
    files:
      - LICENSE
      - README.md
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
release:
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
changelog:
  use: github
  sort: asc
  groups:
    - title: "Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Improvements"
      regexp: '^.*?(perf|refactor|improve)(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "Documentation"
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: "CI & Build"
      regexp: '^.*?(ci|build|chore)(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: "Others"
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
nfpms:
  -
    file_name_template: "tlsinfo_package_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Michael Paepcke
    homepage: https://paepcke.de/tlsinfo
    maintainer: Michael Paepcke <git@paepcke.de>
    description: tlsinfo
    license: BSD 3-Clause
    formats:
      - deb
      - rpm