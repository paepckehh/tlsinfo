<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">tlsinfo - TLS connection report dashboard</title>
  <desc id="hero-desc">The tlsinfo wordmark and an established-2022 badge next to a terminal card running tlsinfo github.com: startup version, TLS 1.3 handshake, cipher suite, certificate validity, SPKI key pin, leaf-bound OCSP staple and STARTTLS support.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f4f8fc"/>
      <stop offset="1" stop-color="#e9f1f8"/>
    </linearGradient>
    <linearGradient id="accent" x1="72" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0969da"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="badge" x1="72" y1="72" x2="144" y2="144" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f1f7fd"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="card" x1="580" y1="56" x2="1136" y2="344" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7fafd"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="56" x2="0" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7fafd"/>
      <stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <linearGradient id="sheen" x1="580" y1="56" x2="760" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1721" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#0d9488" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#0969da" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#e3eaf2" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="400" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)" opacity="0.85"/>
    <ellipse cx="900" cy="110" rx="400" ry="220" fill="url(#glow)"/>
    <ellipse cx="150" cy="360" rx="340" ry="200" fill="url(#glowBlue)"/>
    <path d="M40 330C240 300 330 210 560 190" fill="none" stroke="#0d9488" stroke-opacity="0.14" stroke-width="1.5"/>
    <path d="M40 350C260 320 350 240 560 220" fill="none" stroke="#0969da" stroke-opacity="0.10" stroke-width="1.5"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#accent)" opacity="0.85"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="19.5" fill="none" stroke="#dbe4ec"/>

  <!-- badge -->
  <rect x="72" y="72" width="72" height="72" rx="20" fill="url(#badge)" stroke="#d5dfe9"/>
  <rect x="91" y="110" width="34" height="24" rx="6" fill="none" stroke="url(#accent)" stroke-width="2.6"/>
  <path d="M97 110v-7a11 11 0 0 1 22 0v7" fill="none" stroke="url(#accent)" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="108" cy="121" r="2.4" fill="#0d9488"/>

  <!-- since badge -->
  <rect x="160" y="88" width="132" height="26" rx="13" fill="#ffffff" stroke="#d5dfe9"/>
  <circle cx="178" cy="101" r="3.5" fill="#1a7f37"/>
  <text x="188" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#647587">ON GITHUB SINCE 2022</text>

  <!-- wordmark -->
  <text x="72" y="212" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1.8" fill="url(#accent)">tlsinfo</text>
  <text x="73" y="242" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#647587">Know exactly what's on the wire.</text>
  <text x="73" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#7b8b9b">one static binary   zero config   zero daemon   no external CLI libs</text>

  <!-- feature pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#647587">
    <rect x="72" y="290" width="96" height="28" rx="14" fill="#ffffff" stroke="#d5dfe9"/>
    <text x="120" y="308" text-anchor="middle">TLS 1.3</text>
    <rect x="178" y="290" width="74" height="28" rx="14" fill="#ffffff" stroke="#d5dfe9"/>
    <text x="215" y="308" text-anchor="middle">OCSP</text>
    <rect x="262" y="290" width="106" height="28" rx="14" fill="#ffffff" stroke="#d5dfe9"/>
    <text x="315" y="308" text-anchor="middle">SPKI pins</text>
    <rect x="378" y="290" width="110" height="28" rx="14" fill="#ffffff" stroke="#d5dfe9"/>
    <text x="433" y="308" text-anchor="middle">STARTTLS</text>
  </g>

  <!-- established metrics -->
  <text x="72" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#7b8b9b">2022-12-18 <tspan fill="#0d9488">·</tspan> fourth year of TLS reporting <tspan fill="#0d9488">·</tspan> 5 protocols <tspan fill="#0d9488">·</tspan> 0 runtime deps</text>

  <!-- terminal card -->
  <rect x="580" y="56" width="556" height="288" rx="15" fill="url(#card)" stroke="#d5dfe9"/>
  <rect x="580" y="56" width="556" height="42" rx="15" fill="url(#bar)"/>
  <rect x="580" y="84" width="556" height="14" fill="#eef4fa"/>
  <line x1="580" y1="97.5" x2="1136" y2="97.5" stroke="#d5dfe9"/>
  <rect x="580" y="56" width="556" height="200" fill="url(#sheen)" opacity="0.5"/>
  <circle cx="604" cy="77" r="4.5" fill="#e2555b"/>
  <circle cx="620" cy="77" r="4.5" fill="#d9a52c"/>
  <circle cx="636" cy="77" r="4.5" fill="#1a7f37"/>
  <text x="858" y="81" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7b8b9b">~/tls · tlsinfo</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
    <text x="604" y="122" fill="#7b8b9b">tlsinfo v0.1.69</text>
    <text x="604" y="145" fill="#1a7f37">$ <tspan fill="#0d1721">tlsinfo github.com</tspan></text>

    <text x="604" y="175" fill="#647587">TLS Version</text>
    <text x="748" y="175" fill="#0d1721">TLS1.3 [0x0304] [OK]</text>

    <text x="604" y="198" fill="#647587">Cipher Suite</text>
    <text x="748" y="198" fill="#0d1721">TLS_AES_128_GCM_SHA256</text>

    <text x="604" y="221" fill="#647587">X509 Status</text>
    <text x="748" y="221" fill="#1a7f37">[VALID] <tspan fill="#647587">38 days left</tspan></text>

    <text x="604" y="244" fill="#647587">KeyPin</text>
    <text x="748" y="244" fill="#0969da">/wiL5vgOLgwED41W&#8230;FxK0=</text>

    <text x="604" y="267" fill="#647587">OCSP Staple</text>
    <text x="748" y="267" fill="#1a7f37">[GOOD] <tspan fill="#647587">bound to leaf</tspan></text>

    <text x="604" y="290" fill="#647587">STARTTLS</text>
    <text x="748" y="290" fill="#0d1721">smtp · imap · pop3 · nntp · ftp</text>
  </g>

  <line x1="604" y1="306" x2="1112" y2="306" stroke="#e3eaf2"/>
  <circle cx="609" cy="322" r="3.5" fill="#1a7f37"/>
  <text x="622" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#7b8b9b">one connection · one report</text>
  <text x="1112" y="326" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#1a7f37">exit 0</text>
</svg>
