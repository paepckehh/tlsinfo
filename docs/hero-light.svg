<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">tlsinfo - TLS connection report dashboard</title>
  <desc id="hero-desc">The tlsinfo wordmark next to a terminal card showing a TLS handshake report: remote address, TLS 1.3 verdict, certificate validity, SPKI key pin and a bound OCSP staple.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <linearGradient id="accent" x1="64" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0969da"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="badge" x1="64" y1="64" x2="136" y2="136" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f1f7fd"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="card" x1="596" y1="44" x2="1140" y2="276" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7fafd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#e3eaf2" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity="0.9"/>
    <ellipse cx="930" cy="150" rx="320" ry="160" fill="url(#glow)"/>
    <ellipse cx="120" cy="30" rx="240" ry="150" fill="url(#glow)" opacity="0.7"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="17.5" fill="none" stroke="#dbe4ec"/>

  <!-- badge -->
  <rect x="64" y="64" width="72" height="72" rx="20" fill="url(#badge)" stroke="#d5dfe9"/>
  <rect x="83" y="102" width="34" height="24" rx="6" fill="none" stroke="url(#accent)" stroke-width="2.6"/>
  <path d="M89 102v-7a11 11 0 0 1 22 0v7" fill="none" stroke="url(#accent)" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="100" cy="113" r="2.4" fill="#0d9488"/>

  <!-- wordmark -->
  <text x="64" y="184" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5" fill="url(#accent)">tlsinfo</text>
  <text x="65" y="212" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#5d6f80">Know exactly what's on the wire.</text>

  <!-- feature pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#647587">
    <rect x="64" y="234" width="88" height="28" rx="14" fill="#ffffff" stroke="#d5dfe9"/>
    <text x="108" y="252" text-anchor="middle">TLS 1.3</text>
    <rect x="162" y="234" width="74" height="28" rx="14" fill="#ffffff" stroke="#d5dfe9"/>
    <text x="199" y="252" text-anchor="middle">OCSP</text>
    <rect x="246" y="234" width="104" height="28" rx="14" fill="#ffffff" stroke="#d5dfe9"/>
    <text x="298" y="252" text-anchor="middle">SPKI pins</text>
    <rect x="360" y="234" width="106" height="28" rx="14" fill="#ffffff" stroke="#d5dfe9"/>
    <text x="413" y="252" text-anchor="middle">STARTTLS</text>
  </g>

  <!-- report card -->
  <rect x="596" y="44" width="544" height="232" rx="16" fill="url(#card)" stroke="#d5dfe9"/>
  <circle cx="620" cy="67" r="4.5" fill="#e2555b"/>
  <circle cx="636" cy="67" r="4.5" fill="#d9a52c"/>
  <circle cx="652" cy="67" r="4.5" fill="#2da44e"/>
  <text x="676" y="71" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#647587">tlsinfo github.com</text>
  <line x1="620" y1="90" x2="1116" y2="90" stroke="#e3eaf2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
    <text x="620" y="120" fill="#647587">NET Remote</text>
    <text x="790" y="120" fill="#0d1721">140.82.121.4:443</text>

    <text x="620" y="148" fill="#647587">TLS Version</text>
    <text x="790" y="148" fill="#0d1721">TLS1.3 [0x0304] <tspan fill="#1a7f37">[OK]</tspan></text>

    <text x="620" y="176" fill="#647587">X509 Status</text>
    <text x="790" y="176" fill="#1a7f37">[VALID] <tspan fill="#647587">49 days</tspan></text>

    <text x="620" y="204" fill="#647587">KeyPin</text>
    <text x="790" y="204" fill="#0d1721">/wiL5vgOLgwED41W&#8230;FxK0=</text>

    <text x="620" y="232" fill="#647587">OCSP Staple</text>
    <text x="790" y="232" fill="#1a7f37">[GOOD] <tspan fill="#647587">bound to leaf</tspan></text>
  </g>
</svg>
