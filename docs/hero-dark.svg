<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">tlsinfo - TLS connection report dashboard</title>
  <desc id="hero-desc">The tlsinfo wordmark next to a terminal card running tlsinfo github.com, showing a TLS 1.3 handshake, cipher suite, certificate validity, SPKI key pin, a leaf-bound OCSP staple and STARTTLS support.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0e14"/>
      <stop offset="0.55" stop-color="#0e1621"/>
      <stop offset="1" stop-color="#121a26"/>
    </linearGradient>
    <linearGradient id="accent" x1="72" y1="0" x2="330" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="badge" x1="72" y1="64" x2="136" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16222f"/>
      <stop offset="1" stop-color="#0d1520"/>
    </linearGradient>
    <linearGradient id="card" x1="596" y1="48" x2="1132" y2="312" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111a26"/>
      <stop offset="1" stop-color="#0b121a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="48" x2="0" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18222e"/>
      <stop offset="1" stop-color="#121a24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#2dd4bf" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#182131" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)" opacity="0.5"/>
    <ellipse cx="880" cy="120" rx="360" ry="200" fill="url(#glow)"/>
    <ellipse cx="200" cy="330" rx="300" ry="180" fill="url(#glowBlue)"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#accent)" opacity="0.75"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="17.5" fill="none" stroke="#1e2a3a"/>

  <!-- badge -->
  <rect x="72" y="64" width="64" height="64" rx="18" fill="url(#badge)" stroke="#22303f"/>
  <rect x="89" y="98" width="30" height="21" rx="5" fill="none" stroke="url(#accent)" stroke-width="2.4"/>
  <path d="M94 98v-6a10 10 0 0 1 20 0v6" fill="none" stroke="url(#accent)" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="104" cy="108" r="2.2" fill="#2dd4bf"/>

  <!-- wordmark -->
  <text x="72" y="188" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.6" fill="url(#accent)">tlsinfo</text>
  <text x="73" y="216" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#8b98a9">Know exactly what's on the wire.</text>
  <text x="73" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5d6f80">one static binary   zero config   zero daemon</text>

  <!-- feature pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#93a1b1">
    <rect x="72" y="262" width="92" height="26" rx="13" fill="#101923" stroke="#22303f"/>
    <text x="118" y="279" text-anchor="middle">TLS 1.3</text>
    <rect x="174" y="262" width="72" height="26" rx="13" fill="#101923" stroke="#22303f"/>
    <text x="210" y="279" text-anchor="middle">OCSP</text>
    <rect x="256" y="262" width="102" height="26" rx="13" fill="#101923" stroke="#22303f"/>
    <text x="307" y="279" text-anchor="middle">SPKI pins</text>
    <rect x="368" y="262" width="104" height="26" rx="13" fill="#101923" stroke="#22303f"/>
    <text x="420" y="279" text-anchor="middle">STARTTLS</text>
  </g>

  <!-- terminal card -->
  <rect x="596" y="48" width="536" height="264" rx="14" fill="url(#card)" stroke="#22303f"/>
  <rect x="596" y="48" width="536" height="40" rx="14" fill="url(#bar)"/>
  <rect x="596" y="74" width="536" height="14" fill="#121a24"/>
  <line x1="596" y1="87.5" x2="1132" y2="87.5" stroke="#22303f"/>
  <circle cx="620" cy="68" r="4.5" fill="#f2585b"/>
  <circle cx="636" cy="68" r="4.5" fill="#e3b341"/>
  <circle cx="652" cy="68" r="4.5" fill="#3fb950"/>
  <text x="864" y="72" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7d8b9c">~/tls · tlsinfo</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
    <text x="620" y="113" fill="#56d364">$ <tspan fill="#e6edf3">tlsinfo github.com</tspan></text>

    <text x="620" y="143" fill="#8b98a9">TLS Version</text>
    <text x="760" y="143" fill="#e6edf3">TLS1.3 [0x0304] <tspan fill="#3fb950">[OK]</tspan></text>

    <text x="620" y="168" fill="#8b98a9">Cipher Suite</text>
    <text x="760" y="168" fill="#e6edf3">TLS_AES_128_GCM_SHA256</text>

    <text x="620" y="193" fill="#8b98a9">X509 Status</text>
    <text x="760" y="193" fill="#3fb950">[VALID] <tspan fill="#8b98a9">38 days left</tspan></text>

    <text x="620" y="218" fill="#8b98a9">KeyPin</text>
    <text x="760" y="218" fill="#79c0ff">/wiL5vgOLgwED41W&#8230;FxK0=</text>

    <text x="620" y="243" fill="#8b98a9">OCSP Staple</text>
    <text x="760" y="243" fill="#3fb950">[GOOD] <tspan fill="#8b98a9">bound to leaf</tspan></text>

    <text x="620" y="268" fill="#8b98a9">STARTTLS</text>
    <text x="760" y="268" fill="#e6edf3">smtp · imap · pop3 · nntp · ftp</text>
  </g>

  <line x1="620" y1="284" x2="1108" y2="284" stroke="#1c2837"/>
  <circle cx="625" cy="297" r="3.5" fill="#3fb950"/>
  <text x="638" y="301" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#6e7d8f">one connection · one report</text>
  <text x="1108" y="301" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#3fb950">exit 0</text>
</svg>
